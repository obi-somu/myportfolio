<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#181a18" />
    <title>Portfolio Admin Sign In | Clinton Obi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/admin-login/admin-login.css" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="/js/admin-login.js" defer></script>
  </head>
  <body>
    <main class="login-shell">
      <a class="brand" href="/" aria-label="Return to Clinton Obi portfolio">CO<span>.</span></a>
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">Invite-only workspace</p>
        <h1 id="login-title">Portfolio administration</h1>
        <p class="intro">This area is limited to approved administrators. Sign in with the email address attached to your invitation.</p>
        <p class="status" id="login-status" role="status" aria-live="polite">Checking your session…</p>
        <button class="login-button" id="login-button" type="button" disabled>Sign in securely <span aria-hidden="true">→</span></button>
        <a class="back-link" href="/">← Return to the portfolio</a>
      </section>
      <p class="security-note"><span aria-hidden="true">●</span> Access is protected by Netlify Identity and an administrator role.</p>
    </main>
    <noscript><p class="noscript">JavaScript is required to sign in to the portfolio dashboard.</p></noscript>
  </body>
</html>
