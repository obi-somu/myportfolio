<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Admin Access Required</title>
    <style>
      body {
        align-items: center;
        background: #f6f3ee;
        color: #1f2933;
        display: flex;
        font-family: Inter, Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 34rem;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1;
        margin: 0 0 1rem;
      }

      p {
        color: #52616b;
        font-size: 1rem;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }

      a {
        color: #0f766e;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Admin access required</h1>
      <p>This area is limited to approved site administrators. Use an account with the admin role to continue.</p>
      <a href="/">Return to site</a>
    </main>
  </body>
</html>
