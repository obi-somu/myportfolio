backend:
  name: git-gateway
  branch: master

local_backend: false

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "site"
        label: "Site Content"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Brand", name: "brand", widget: "string" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Headline", name: "headline", widget: "text" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Availability", name: "availability", widget: "text" }
          - { label: "About", name: "about", widget: "text" }
          - { label: "Profile Image", name: "profileImage", widget: "image", required: false }
          - { label: "CV File", name: "cv", widget: "file", required: false }
          - { label: "Contact Text", name: "contactText", widget: "text" }
          - label: "Metrics"
            name: "metrics"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Experience"
            name: "experience"
            widget: "list"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Bullets", name: "bullets", widget: "list" }
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Button Label", name: "label", widget: "string", required: false }
          - { label: "Certifications", name: "certifications", widget: "list" }
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Group", name: "group", widget: "string" }
              - { label: "Items", name: "items", widget: "list" }
          - label: "Contact Links"
            name: "contactLinks"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
