backend:
  name: git-gateway
  branch: master

publish_mode: simple
local_backend: false
site_url: https://clintonobi.netlify.app
display_url: https://clintonobi.netlify.app
show_preview_links: false

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

editor:
  preview: false

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "site"
        label: "Site Content"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Brand", name: "brand", widget: "string" }
          - { label: "Full name", name: "name", widget: "string" }
          - { label: "Hero location", name: "location", widget: "string" }
          - { label: "Based in", name: "basedIn", widget: "string" }
          - { label: "Headline, first line", name: "headlinePrimary", widget: "string" }
          - { label: "Headline, accent line", name: "headlineAccent", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Availability", name: "availability", widget: "string" }
          - { label: "About heading", name: "aboutHeading", widget: "string" }
          - { label: "About, lead", name: "aboutLead", widget: "text" }
          - { label: "About, detail", name: "aboutDetail", widget: "text" }
          - { label: "Profile image", name: "profileImage", widget: "image" }
          - { label: "CV file", name: "cv", widget: "file" }
          - { label: "Projects introduction", name: "projectsIntro", widget: "text" }
          - { label: "Experience introduction", name: "experienceIntro", widget: "text" }
          - { label: "Capabilities introduction", name: "capabilitiesIntro", widget: "text" }
          - { label: "Contact heading", name: "contactHeading", widget: "string" }
          - { label: "Contact introduction", name: "contactText", widget: "text" }
          - label: "Experience"
            name: "experience"
            widget: "list"
            summary: "{{fields.period}} · {{fields.role}}"
            fields:
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company and location", name: "company", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Skills", name: "tags", widget: "list" }
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.number}} · {{fields.title}}"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Type", name: "type", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Challenge", name: "challenge", widget: "text" }
              - { label: "Contribution", name: "contribution", widget: "text" }
              - { label: "Outcome", name: "outcome", widget: "text" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Link label", name: "label", widget: "string" }
          - { label: "Credentials", name: "certifications", widget: "list" }
          - label: "Capabilities"
            name: "skills"
            widget: "list"
            summary: "{{fields.group}}"
            fields:
              - { label: "Group", name: "group", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Items", name: "items", widget: "list" }
          - label: "Contact links"
            name: "contactLinks"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
